# ==========================================================================
#  Mi8Helicopter — настройки
#  Все координаты точек (сиденья, кнопки) заданы в ЕДИНИЦАХ BLOCKBENCH,
#  как в файле mi8_helicopter.bbmodel: нос смотрит на -Z, левый борт — -X,
#  y = 0 — земля под колёсами. 8 единиц = 1 блок.
# ==========================================================================

resource-pack:
  # Отправлять ресурспак игрокам при входе
  send-on-join: true
  # Внешняя ссылка на zip (если пусто — плагин раздаёт пак сам встроенным HTTP-сервером)
  url: ""
  # Встроенный HTTP-сервер: порт и адрес, по которому игроки достучатся до сервера
  port: 8163
  public-host: "localhost"
  # Заставить принять пак (иначе вертолёт будет невидимым)
  required: false

model:
  # Поворот модели ItemDisplay. Если вертолёт летит хвостом вперёд — поставьте 0.
  yaw-offset: 180
  # Смещение сиденья по высоте (блоки), чтобы игрок сидел ровно на подушке
  seat-y-offset: -0.35
  # Дальность прорисовки (множитель, 1.0 = 64 блока)
  view-range: 4.0

seats:
  - {name: "Пилот", pos: [-4.6, 11.2, -32.5], pilot: true}
  - {name: "Второй пилот", pos: [4.6, 11.2, -32.5]}
  - {name: "Левая скамья 1", pos: [-8.0, 12.4, -8.0]}
  - {name: "Левая скамья 2", pos: [-8.0, 12.4, -1.0]}
  - {name: "Левая скамья 3", pos: [-8.0, 12.4, 6.0]}
  - {name: "Правая скамья 1", pos: [8.0, 12.4, -20.0]}
  - {name: "Правая скамья 2", pos: [8.0, 12.4, -12.0]}
  - {name: "Правая скамья 3", pos: [8.0, 12.4, -4.0]}
  - {name: "Правая скамья 4", pos: [8.0, 12.4, 4.0]}
  - {name: "Правая скамья 5", pos: [8.0, 12.4, 12.0]}

# Кнопки (невидимые хитбоксы, ПКМ): SIDE_DOOR, REAR_DOORS, COCKPIT_DOOR, STORAGE
hotspots:
  - {action: SIDE_DOOR, pos: [-20.0, 7.0, -19.5], width: 1.4, height: 2.4}   # снаружи у боковой двери
  - {action: SIDE_DOOR, pos: [-5.5, 8.0, -19.5], width: 1.0, height: 2.0}    # изнутри
  - {action: REAR_DOORS, pos: [0.0, 4.0, 38.0], width: 2.6, height: 2.2}     # снаружи у створок
  - {action: REAR_DOORS, pos: [7.0, 8.0, 18.0], width: 1.0, height: 1.8}     # изнутри
  - {action: COCKPIT_DOOR, pos: [0.0, 8.0, -24.5], width: 1.0, height: 2.0}
  - {action: STORAGE, pos: [-3.0, 7.0, 16.0], width: 1.3, height: 1.4}       # ящики в салоне

# Коллизия «на стоянке»: пока вертолёт стоит с выключенным двигателем,
# вокруг салона ставятся невидимые барьеры — внутрь можно зайти и ходить.
shell:
  enabled: true

flight:
  health: 100
  startup-seconds: 5        # раскрутка винта
  shutdown-seconds: 7
  accel: 0.035              # разгон вперёд (блоков/тик²)
  strafe-accel: 0.02
  climb-accel: 0.03
  gravity: 0.06
  max-speed: 1.1            # блоков/тик (≈ 80 км/ч)
  boost-multiplier: 1.7     # Ctrl (бег) — форсаж
  turn-rate: 3.5            # град/тик
  drag: 0.965
  crash-speed: 0.75         # удар быстрее этого — повреждение
  crash-damage: 120
  rotor-strike: true        # лопасти ломаются о блоки
  allow-jump-out: false     # можно ли выпрыгнуть в полёте
  engine-off-delay: 100     # тиков без пилота на земле до выключения двигателя

effects:
  rotor-sound: "minecraft:entity.phantom.flap"
  downwash: true
