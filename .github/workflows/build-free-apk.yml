name: Build TogetherForever APK

# Собирает APK и выкладывает его в Releases этого репозитория.
# Адрес сервера берётся из переменной репозитория PB_URL:
#   Settings → Secrets and variables → Actions → Variables → New variable
#   PB_URL = https://твой-домен
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'server/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tf-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-server:
    if: vars.PB_URL == ''
    runs-on: ubuntu-latest
    steps:
      - name: Сервер не задан
        run: |
          echo "::notice::Сборка пропущена: не задана переменная PB_URL (адрес своего сервера)."
          echo "Подними сервер (server/README.md), затем Settings → Secrets and variables → Actions → Variables → PB_URL."

  build:
    if: vars.PB_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-tf-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-tf-

      # Плагин google-services требует файл на этапе сборки. Здесь заглушка:
      # FCM не работает, уведомления идут через фоновый канал приложения.
      - name: Placeholder google-services.json
        run: cp android/app/google-services.free.json android/app/google-services.json

      # Постоянная подпись (новые версии ставятся поверх старых) — если заданы
      # секреты KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
      # Без них APK подписывается отладочным ключом.
      - name: Signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::warning::Нет секретов подписи — APK подписан отладочным ключом, обновление поверх потребует переустановки."
          fi

      - run: flutter pub get

      - name: Build APK
        env:
          PB_URL: ${{ vars.PB_URL }}
          CENTRIFUGO_WS: ${{ vars.CENTRIFUGO_WS }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          --dart-define=STORE=free --dart-define=FREE_EDITION=true
          --dart-define=PB_URL="$PB_URL"
          --dart-define=CENTRIFUGO_WS="$CENTRIFUGO_WS"
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=REPO_URL="$REPO_URL"

      - name: Rename APKs
        id: out
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$f" "dist/TogetherForever-${VER}-${abi}.apk"
          done
          ls -la dist
          echo "tag=v${VER}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TogetherForever-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.out.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TogetherForever ${{ steps.out.outputs.ver }} (#${{ github.run_number }})
          make_latest: true
          body: |
            **TogetherForever** — бесплатное приложение для двоих: без рекламы, без подписок, всё открыто.

            **Какой файл качать:** `arm64-v8a` — почти все современные телефоны.
            `armeabi-v7a` — старые 32-битные, `x86_64` — эмуляторы.

            Сервер: ${{ vars.PB_URL }}
          files: dist/*.apk
