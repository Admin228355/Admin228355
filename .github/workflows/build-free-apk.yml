name: Build Togetherly Free APK

# Собирает бесплатную сборку (без рекламы, всё открыто) и кладёт APK в
# GitHub Releases этого репозитория — скачивать прямо с телефона.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-free-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-free-

      # Плагин google-services требует файл на этапе сборки. Здесь заглушка:
      # пуши FCM не работают, приложение уходит на свой фоновый канал.
      - name: Placeholder google-services.json
        run: cp android/app/google-services.free.json android/app/google-services.json

      # Постоянная подпись (чтобы новые версии ставились поверх старых) —
      # если заданы секреты KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS /
      # KEY_PASSWORD. Без них APK подписывается отладочным ключом.
      - name: Signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "Секретов подписи нет — подпись отладочным ключом."
          fi

      - run: flutter pub get

      - name: Build APK
        run: >
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          --dart-define=STORE=free --dart-define=FREE_EDITION=true

      - name: Rename APKs
        id: out
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="free-v${VER}-${{ github.run_number }}"
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$f" "dist/Togetherly-Free-${VER}-${abi}.apk"
          done
          ls -la dist
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Togetherly-Free-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.out.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Togetherly Free ${{ steps.out.outputs.ver }} (#${{ github.run_number }})
          make_latest: true
          body: |
            Бесплатная сборка Togetherly: Togetherly+ открыт, реклама выключена,
            темы/фоны/значки/паки за монеты открыты, +10 новых палитр.

            **Какой файл качать:** `arm64-v8a` — почти все современные телефоны.
            `armeabi-v7a` — старые 32-битные, `x86_64` — эмуляторы.
          files: dist/*.apk
